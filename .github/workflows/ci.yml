name: Validate planner
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: |
          CHROMIUM_PATH=$(node --input-type=module -e "import { chromium } from '@playwright/test'; process.stdout.write(chromium.executablePath())") npm run test:e2e
          CHROMIUM_PATH=$(node --input-type=module -e "import { chromium } from '@playwright/test'; process.stdout.write(chromium.executablePath())") npm run test:pwa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            test-results/
            pwa-test-results/
          retention-days: 7
